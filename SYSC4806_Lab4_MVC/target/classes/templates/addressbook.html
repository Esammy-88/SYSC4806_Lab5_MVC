<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Address Book ' + ${addressBook.id}">Address Book</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #999; padding: 0.4rem 0.8rem; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>
<h1 th:text="'Address Book #' + ${addressBook.id}">Address Book</h1>

<p th:if="${#lists.isEmpty(addressBook.buddies)}">This address book has no buddies yet.</p>

<table th:unless="${#lists.isEmpty(addressBook.buddies)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Phone number</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="buddy : ${addressBook.buddies}">
        <td th:text="${buddy.id}">1</td>
        <td th:text="${buddy.name}">Name</td>
        <td th:text="${buddy.phoneNumber}">613-555-0000</td>
    </tr>
    </tbody>
</table>
</body>
</html>
