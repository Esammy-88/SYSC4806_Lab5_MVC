<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
</head>
<body>
<p><a th:href="@{/}">&larr; All address books</a></p>

<h1 th:text="'Address Book #' + ${addressBook.id}">Address Book</h1>

<table border="1">
    <thead>
    <tr><th>Name</th><th>Phone</th><th>Address</th></tr>
    </thead>
    <tbody>
    <tr th:each="buddy : ${addressBook.buddies}">
        <td th:text="${buddy.name}">name</td>
        <td th:text="${buddy.phoneNumber}">phone</td>
        <td th:text="${buddy.address}">address</td>
    </tr>
    <tr th:if="${#lists.isEmpty(addressBook.buddies)}">
        <td colspan="3">No buddies yet.</td>
    </tr>
    </tbody>
</table>

<h2>Add a buddy</h2>
<form th:action="@{/addressbook/{id}/buddies(id=${addressBook.id})}" method="post">
    <label>Name <input type="text" name="name" required></label>
    <label>Phone <input type="text" name="phoneNumber"></label>
    <label>Address <input type="text" name="address"></label>
    <button type="submit">Add buddy</button>
</form>
</body>
</html>
